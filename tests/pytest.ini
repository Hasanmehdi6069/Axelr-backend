[pytest]
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_functions = test_*
pythonpath = .

markers =
    e2e: end-to-end tests (single-process, no external deps)
    quality: model-quality benchmarks (may hit twin engine)
    chaos: fault injection tests
    perf: wall-clock performance tests — opt-in via `pytest -m perf`
    stress: sustained load tests — opt-in via `pytest -m stress`
    load: production load tests — opt-in via `pytest -m load`
    live: tests requiring a live server — opt-in via `PYTEST_LIVE=1`
    asyncio: async test (auto)