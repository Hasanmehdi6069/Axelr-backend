services:
  - type: web
    name: axelr-core
    env: python
    region: oregon
    plan: free  # Explicitly uses Render's free tier: 512MB RAM / 0.1vCPU
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ENV
        value: production
      - key: LITELLM_URL
        fromService:
          name: axelr-ai-workers
          property: url
    autoDeploy: true
    disk:
      name: axelr-data
      mountPath: /data
      sizeGB: 1