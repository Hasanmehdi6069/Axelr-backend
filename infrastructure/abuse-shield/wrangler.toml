name = "axelr-abuse-shield"
main = "worker.ts"
compatibility_date = "2024-01-01"

[vars]
RATE_LIMIT_MAX_REQUESTS = "1000"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_TIER_PREMIUM_MAX = "5000"
RATE_LIMIT_TIER_FREE_MAX = "100"

[triggers]
crons = ["*/10 * * * *"]

[env.production.vars]
RATE_LIMIT_MAX_REQUESTS = "1000"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_TIER_PREMIUM_MAX = "5000"
RATE_LIMIT_TIER_FREE_MAX = "100"

[env.staging.vars]
RATE_LIMIT_MAX_REQUESTS = "2000"
RATE_LIMIT_WINDOW_SECONDS = "60"
RATE_LIMIT_TIER_PREMIUM_MAX = "10000"
RATE_LIMIT_TIER_FREE_MAX = "200"