name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── 1. LINT (fast fail) ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.8
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  # ─── 2. TYPE CHECK ──────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install pyright
      - run: pyright app.py

  # ─── 3. UNIT TESTS (offline, deterministic) ─────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      ENV: test
      JWT_SECRET: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxx
      MONGO_URI: ""
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - run: pytest -q --cov=. --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # ─── 4. SECURITY SCAN ───────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install bandit[toml]
          bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ─── 5. FRONTEND E2E (gated by unit tests) ──────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: |
          pip install -r requirements.txt
      - working-directory: tests/frontend
        run: npm ci
      - working-directory: tests/frontend
        run: npx playwright install --with-deps chromium
      - name: Boot uvicorn
        env:
          ENV: dev
          JWT_SECRET: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxx
          MONGO_URI: ""
          REDIS_URL: ""
          WEBHOOK_INBOUND_TOKEN: test-token
          WEBHOOK_INBOUND_SECRET: test-secret
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ping >/dev/null && exit 0
            sleep 1
          done
          tail -n 200 uvicorn.log >&2
          exit 1
      - working-directory: tests/frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/frontend/playwright-report
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: uvicorn.log
      - if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" 2>/dev/null || true
          fi