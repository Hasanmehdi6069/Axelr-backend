# render.yaml
services:
  - type: web
    name: axelr-core
    env: python
    region: oregon
    plan: free                       # 512 MB RAM / 0.1 vCPU
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: WORKSPACE_ROOT
        value: /app
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: AXELR_COGNITION_LEVEL
        value: "2"
      - key: ENABLE_BLAST_RADIUS
        value: "true"
      - key: TWIN_FAST_PARALLEL
        value: "2"
      - key: TWIN_MAX_INFLIGHT_FAST
        value: "2"
      - key: TWIN_MAX_INFLIGHT_ELITE
        value: "1"
      - key: PIPELINE_FAST_DEADLINE_S
        value: "15.0"
      - key: PIPELINE_PRO_DEADLINE_S
        value: "30.0"