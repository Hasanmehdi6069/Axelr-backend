[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:bifrost]
command=/usr/local/bin/bifrost --port 8080 --config /app/bifrost.json
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
priority=10
environment=GOMAXPROCS="1",GOMEMLIMIT="64MiB"

[program:inference]
command=uvicorn snapdeploy_app:app --host 0.0.0.0 --port 8081 --workers 1
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
priority=20
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1"