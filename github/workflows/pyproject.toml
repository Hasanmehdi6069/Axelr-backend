[tool.ruff]
target-version = "py311"
line-length = 100
# Remove stale paths — the excluded files don't exist.
extend-exclude = ["workers/data_worker.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "ASYNC", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "N"]
"core/conversation.py" = ["S324"]      # was: core/conversation_memory.py (doesn't exist)
"core/repo_indexer.py" = ["S324"]
"core/webhook_pipeline.py" = ["S104"]

[tool.bandit]
exclude_dirs = ["tests", "workers"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]