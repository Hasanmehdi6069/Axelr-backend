  # ─── 17. APPWRITE TESTS ───────────────────────────────────────────────
  appwrite-tests:
    name: Appwrite Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
