      - run: |
          cd Axelr-backend
          python -m pytest tests/runtime/ -v

  # ─── 16. PAYMENTS TESTS ───────────────────────────────────────────────
  payments-tests:
    name: Payments Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
