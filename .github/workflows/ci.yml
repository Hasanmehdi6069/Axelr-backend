name: AXELR Unified CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── 1. META-TESTS (fast fail - validate test harness integrity) ───────
  meta-tests:
    name: Meta-Tests (Test Harness Integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Run meta-tests
        run: |
          cd Axelr-backend
          python -m pytest tests/_meta/ -v

  # ─── 2. LINT (fast fail) ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: meta-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.8
      - run: ruff check Axelr-backend --output-format=github
      - run: ruff format --check Axelr-backend

  # ─── 3. TYPE CHECK ────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          cd Axelr-backend
          pip install -r requirements.txt
          pip install pyright
      - run: |
          cd Axelr-backend
          pyright

  # ─── 4. UNIT TESTS (offline, deterministic) ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      ENV: test
      JWT_SECRET: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxx
      MONGO_URI: ""
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          cd Axelr-backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - run: |
          cd Axelr-backend
          python -m pytest tests/ -q --cov=. --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v4
        with:
          file: ./Axelr-backend/coverage.xml

  # ─── 5. QUALITY TESTS (RAG, latency, OOD) ───────────────────────────
  quality-tests:
    name: Quality Tests (RAG, Latency, OOD)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          cd Axelr-backend
          pip install -r requirements.txt
      - run: |
          cd Axelr-backend
          python -m pytest tests/quality/ -v

  # ─── 6. SECURITY PRIMITIVES ───────────────────────────────────────────
  security-tests:
    name: Security Primitives
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          cd Axelr-backend
          pip install -r requirements.txt
      - run: |
          cd Axelr-backend
          python -m pytest tests/security/ -v

  # ─── 7. GATEWAY PROVIDER COMPATIBILITY ────────────────────────────────
  gateway-tests:
    name: Gateway Provider Compatibility
    runs-on: ubuntu-latest
