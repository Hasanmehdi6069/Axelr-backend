          pip install -r requirements.txt
      - run: |
          cd Axelr-backend
          python -m pytest tests/chaos/ -v

  # ─── 10. RESILIENCE TESTS ────────────────────────────────────────────
  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    needs: unit-tests
