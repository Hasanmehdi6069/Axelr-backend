      - run: |
          cd Axelr-backend
          python -m pytest tests/dr/ -v

  # ─── 20. FRONTEND E2E ────────────────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [unit-tests, quality-tests, security-tests]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Axelr-Frontend/package-lock.json
      - run: |
          cd Axelr-backend
          pip install -r requirements.txt
      - run: |
          cd Axelr-Frontend
          npm install
      - name: Boot uvicorn
        env:
          ENV: dev
          JWT_SECRET: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxx
          MONGO_URI: ""
          REDIS_URL: ""
          WEBHOOK_INBOUND_TOKEN: test-token
          WEBHOOK_INBOUND_SECRET: test-secret
        run: |
          cd Axelr-backend
          nohup uvicorn api.warhead:create_app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ping >/dev/null && exit 0
            sleep 1
          done
          tail -n 200 uvicorn.log >&2
          exit 1
      - name: Run frontend build
        run: |
          cd Axelr-Frontend
          npm run build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-build
          path: Axelr-Frontend/dist
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: Axelr-backend/uvicorn.log
      - if: always()
        run: |
          if [ -f Axelr-backend/uvicorn.pid ]; then
            kill "$(cat Axelr-backend/uvicorn.pid)" 2>/dev/null || true
          fi